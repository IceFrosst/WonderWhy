<!doctype html>
<!-- V03 "Over the shoulder, and the honest panel": printer3d floats in the wearer's eye line in front of the Prusa,
     looks back at them for a beat, explodes its print head; an inset then shows what the glasses really show:
     a small panel right of centre in one eye. window.renderFrame(t) is a pure function of t. -->
<html><head><meta charset="utf-8"><title>V03 honest panel</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
<script type="importmap">{"imports":{"three":"/app/render3d/node_modules/three/build/three.module.js","three/addons/":"/app/render3d/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="/video/act1/lib/kit.js"></script>
<script type="module">
import { hologram } from '../lib/holo.js';
const ctx = document.getElementById('c').getContext('2d');
const cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
await K.loadFonts(); await K.loadFootage();
const h = await hologram('printer3d', { scale: 2 });
const T = cfg.timeline, C = cfg.copy, E = K.ease, W = K.W, H = K.H;
const CYAN = '#4df0ff', AMBER = '#ffc247';

const key = (a, t) => { // linear between keyframes
  let i = 0; while (i < a.length - 2 && t > a[i + 1].t) i++;
  const p = a[i], q = a[Math.min(i + 1, a.length - 1)], u = q.t > p.t ? K.clamp((t - p.t) / (q.t - p.t)) : 0;
  return Object.fromEntries(Object.keys(p).map(k => [k, K.lerp(p[k], q[k], u)]));
};
const rrect = (g, x, y, w, hh, r) => { g.beginPath(); g.roundRect(x, y, w, hh, r); };

const plate = K.layer(), grey = K.layer(), holo = K.layer(), soft = K.layer(h.size, h.size);
const sg = soft.getContext('2d');
// close-up beats overflow the square render: fade its edges so the hologram never shows a hard box
const feather = img => {
  sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, h.size, h.size); sg.drawImage(img, 0, 0);
  const r = h.size / 2, g = sg.createRadialGradient(r, r, 0, r, r, r);
  g.addColorStop(0, '#000'); g.addColorStop(0.74, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
  sg.globalCompositeOperation = 'destination-in'; sg.fillStyle = g; sg.fillRect(0, 0, h.size, h.size);
  return soft;
};
const pg = plate.getContext('2d'), gg = grey.getContext('2d'), hg = holo.getContext('2d');

// ---- choreography ------------------------------------------------------------------------------------------
// yaw offset (deg) on top of the beat camera: a slow turn, blended to "face the wearer" (-beat yaw) for the look-back.
const turn = t => 8 * Math.max(0, Math.min(t, T.explode) - T.appear[0]) + 3 * Math.max(0, t - T.explode);
const lookW = t => { const [a, b, c, d] = T.look; return t < b ? E.inOut(K.prog(t, a, b)) : 1 - E.inOut(K.prog(t, c, d)); };
const view = t => {
  const w = lookW(t), yaw = K.lerp(turn(t), -h.beats[0].yaw - 4, w);
  const nod = -6 * Math.sin(Math.PI * K.prog(t, T.look[1] + 0.05, T.look[2] - 0.05)); // small dip while it stares
  return { yaw, pitch: nod };
};
const beatAt = t => t < T.explode ? [0, K.clamp(t - T.appear[0] + 0.05, 0, 1.0)] : [1, t - T.explode];

// ---- plate: footage (or the labelled placeholder), grey that clears from the hologram outwards --------------
async function drawPlate(t, a) {
  const f = cfg.footage.plate, im = await K.footageFrame('plate', t - f.start);
  pg.save();
  if (im) K.cover(pg, im, 1.0 + 0.004 * t);
  else {
    K.placeholder(pg, f.label, f.sub, { zoom: 1.0 + 0.004 * t, y: 120 });
    const p = cfg.guide.printer; // where we guess the real printer sits, so the anchor reads in stills
    pg.setLineDash([14, 10]); pg.strokeStyle = 'rgba(244,230,200,0.35)'; pg.lineWidth = 3;
    pg.strokeRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h); pg.setLineDash([]);
    pg.fillStyle = 'rgba(244,230,200,0.45)'; pg.font = '600 24px Archivo'; pg.textAlign = 'center';
    pg.fillText(p.label, p.x, p.y + p.h / 2 - 24);
  }
  pg.restore();
  const c = E.inOut(K.prog(t, T.colour[0], T.colour[1]));
  ctx.save(); ctx.filter = `saturate(${K.lerp(1, 1.1, c)}) contrast(${K.lerp(1, 1.04, c)})`; ctx.drawImage(plate, 0, 0); ctx.restore();
  if (c >= 1) return;
  gg.globalCompositeOperation = 'source-over'; gg.clearRect(0, 0, W, H);
  gg.filter = 'grayscale(1) contrast(1.08) brightness(0.74)'; gg.drawImage(plate, 0, 0); gg.filter = 'none';
  gg.globalCompositeOperation = 'soft-light'; gg.fillStyle = 'rgba(80,110,160,0.5)'; gg.fillRect(0, 0, W, H);
  if (c > 0) { // colour clears outwards from the hologram, soft edge
    const R = 60 + c * 2300, edge = 520, g = gg.createRadialGradient(a.x, a.y, 0, a.x, a.y, R + edge);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(R / (R + edge), 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    gg.globalCompositeOperation = 'destination-out'; gg.fillStyle = g; gg.fillRect(0, 0, W, H);
  }
  ctx.drawImage(grey, 0, 0);
}

// ---- the hologram, "printed" in from the bottom up ----------------------------------------------------------
function drawHolo(t, a, img) {
  hg.clearRect(0, 0, W, H);
  const k = K.prog(t, T.appear[0], T.appear[1]); if (k <= 0) return;
  const bob = 7 * Math.sin(t * 1.9), s = K.lerp(0.94, 1, E.out3(k)), w = a.w * s, y0 = a.y + bob;
  const top = y0 - w / 2, rev = K.lerp(y0 + w * 0.42, top, E.inOut(k)); // reveal edge rising
  hg.save(); hg.translate(a.x, y0); hg.rotate(a.rot * Math.PI / 180); hg.translate(-a.x, -y0);
  hg.save(); hg.beginPath(); hg.rect(a.x - w, rev, w * 2, w * 1.5); hg.clip();
  hg.drawImage(img, a.x - w / 2, top, w, w); hg.restore();
  if (k < 1) { // thin scan line at the reveal edge, like the next layer going down
    const g = hg.createLinearGradient(a.x - w * 0.36, 0, a.x + w * 0.36, 0);
    g.addColorStop(0, K.rgba(CYAN, 0)); g.addColorStop(0.5, K.rgba(CYAN, 0.9 * Math.sin(Math.PI * k))); g.addColorStop(1, K.rgba(CYAN, 0));
    hg.fillStyle = g; hg.fillRect(a.x - w * 0.36, rev - 1.5, w * 0.72, 3);
  }
  hg.restore();
}

// ---- trigger: a soft listening ring where the hologram will appear -----------------------------------------
function drawTrigger(t, a) {
  const k = K.prog(t, T.trigger, T.trigger + 0.6); if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 2; i++) {
    const u = K.clamp(k * 1.25 - i * 0.25); if (u <= 0) continue;
    ctx.strokeStyle = K.rgba(CYAN, 0.55 * (1 - u)); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a.x, a.y, 30 + E.out3(u) * 260, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

// ---- labels on the exploded head (real part names from the spec) ---------------------------------------------
function drawLabels(t, a, b, tb, inset) {
  const k = E.out3(K.prog(t, T.labels, T.labels + 0.5)); if (k <= 0 || b !== 1) return;
  const L = h.labels(b, tb), bob = 7 * Math.sin(t * 1.9);
  ctx.save(); ctx.font = '600 semi-condensed 30px Archivo'; ctx.textBaseline = 'middle';
  L.forEach((l, i) => {
    const u = E.out3(K.prog(t, T.labels + i * 0.12, T.labels + i * 0.12 + 0.45)); if (u <= 0) return;
    const px = a.x + (l.x / 600 - 0.5) * a.w, py = a.y + bob + (l.y / 600 - 0.5) * a.w;
    const dir = l.side === 'l' ? -1 : 1, tw = ctx.measureText(l.text).width;
    let ex = px + dir * 70 * u, tx = dir < 0 ? ex - 12 - tw : ex + 12;
    tx = K.clamp(tx, 48, W - 48 - tw);
    if (inset && tx + tw > inset.x - 20 && py > inset.y - 60) tx = Math.min(tx, inset.x - 32 - tw); // keep clear of the inset
    ctx.globalAlpha = u * k;
    ctx.strokeStyle = K.rgba(CYAN, 0.8); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, py); ctx.stroke();
    ctx.fillStyle = CYAN; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(6,14,20,0.55)'; rrect(ctx, tx - 10, py - 22, tw + 20, 44, 8); ctx.fill();
    ctx.fillStyle = '#eafcff'; ctx.fillText(l.text, tx, py + 1);
  });
  ctx.restore();
}

// ---- the honest inset: the wearer's right-lens view, with the real fixed panel right of centre -------------
function insetRect(t) {
  const [a, b] = T.inset, k = K.prog(t, a, b); if (k <= 0) return null;
  const r = key(cfg.inset, t), hh = r.w * 9 / 16, slide = (1 - E.out5(k)) * (W - r.x + 40);
  return { x: r.x + slide, y: r.y, w: r.w, h: hh, k, rot: (1 - E.out3(k)) * 3 };
}
function panelRect(I) {
  const P = cfg.panel, s = I.h * P.size;
  return { x: I.x + I.w * P.cx - s / 2, y: I.y + I.h * P.cy - s / 2, s };
}
function drawInset(t, I, img) {
  if (!I) return;
  const P = panelRect(I);
  ctx.save();
  ctx.translate(I.x + I.w / 2, I.y + I.h / 2); ctx.rotate(I.rot * Math.PI / 180); ctx.translate(-I.x - I.w / 2, -I.y - I.h / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#000'; rrect(ctx, I.x, I.y, I.w, I.h, 18); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); rrect(ctx, I.x, I.y, I.w, I.h, 18); ctx.clip();
  // the same world, seen through the lens: slightly darker, no hologram in it
  ctx.filter = 'brightness(0.82) saturate(0.95)';
  ctx.drawImage(plate, W * 0.06, H * 0.06, W * 0.88, H * 0.88, I.x, I.y, I.w, I.h); ctx.filter = 'none';
  const vg = ctx.createRadialGradient(I.x + I.w / 2, I.y + I.h / 2, I.h * 0.35, I.x + I.w / 2, I.y + I.h / 2, I.w * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = vg; ctx.fillRect(I.x, I.y, I.w, I.h);
  // the panel: fixed, small, crisp. It does not follow the printer.
  const pa = E.out3(K.prog(t, T.inset[1] - 0.1, T.inset[1] + 0.3));
  ctx.globalAlpha = pa;
  ctx.fillStyle = 'rgba(4,10,14,0.66)'; rrect(ctx, P.x, P.y, P.s, P.s, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(220,245,255,0.4)'; ctx.lineWidth = 1.5; rrect(ctx, P.x, P.y, P.s, P.s, 12); ctx.stroke();
  ctx.save(); rrect(ctx, P.x, P.y, P.s, P.s, 12); ctx.clip();
  ctx.globalCompositeOperation = 'screen'; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, P.x, P.y, P.s, P.s);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.font = '600 semi-condensed 19px Archivo'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textBaseline = 'top';
  ctx.fillText(C.lens.toUpperCase(), I.x + 18, I.y + 16);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; rrect(ctx, I.x, I.y, I.w, I.h, 18); ctx.stroke();
  ctx.restore();
  // tag under the inset
  const ta = E.out3(K.prog(t, T.inset[1], T.inset[1] + 0.4));
  ctx.save(); ctx.globalAlpha = ta; ctx.font = '500 27px Archivo'; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; const tw = ctx.measureText(C.inset).width;
  rrect(ctx, I.x + I.w - tw - 14, I.y + I.h + 12, tw + 28, 42, 8); ctx.fill();
  ctx.fillStyle = '#f4f1ea'; ctx.fillText(C.inset, I.x + I.w, I.y + I.h + 20); ctx.restore();
}
// ghost of the hologram flying into the panel as the inset lands: the same thing, much smaller
function drawHandoff(t, a, I, img) {
  if (!I) return;
  const k = K.prog(t, T.inset[0] + 0.1, T.inset[1] + 0.15); if (k <= 0 || k >= 1) return;
  const P = panelRect(I), u = E.inOut3(k), s = K.lerp(a.w, P.s, u);
  const x = K.lerp(a.x, P.x + P.s / 2, u), y = K.lerp(a.y, P.y + P.s / 2, u);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.45 * Math.sin(Math.PI * k);
  ctx.drawImage(img, x - s / 2, y - s / 2, s, s); ctx.restore();
}

function drawText(t) {
  const [v0, v1] = T.vo, va = Math.min(K.prog(t, v0, v0 + 0.2), 1 - K.prog(t, v1 - 0.2, v1));
  if (va > 0) { // burned-in subtitle for the VO
    ctx.save(); ctx.globalAlpha = va; ctx.font = '500 42px Archivo'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(C.vo).width;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rrect(ctx, W / 2 - tw / 2 - 22, H - 132, tw + 44, 64, 10); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillText(C.vo, W / 2, H - 99); ctx.restore();
  }
  const ga = E.out3(K.prog(t, T.tag, T.tag + 0.5)); // small print: what you are looking at is a visualisation
  if (ga > 0) {
    ctx.save(); ctx.globalAlpha = 0.72 * ga; ctx.font = '500 italic 24px Archivo'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f4f1ea'; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8;
    ctx.fillText(C.tag, 56, H - 48); ctx.restore();
  }
}

window.renderFrame = async t => {
  const a = key(cfg.anchor, t), [b, tb] = beatAt(t);
  h.explore.setView(view(t));
  const img = h.draw(b, tb);
  await drawPlate(t, a);
  drawTrigger(t, a);
  const ha = K.prog(t, T.appear[0], T.appear[1]); // soft dark bed under the hologram so it reads over bright footage
  if (ha > 0) {
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.w * 0.55);
    g.addColorStop(0, `rgba(0,6,12,${0.32 * ha})`); g.addColorStop(1, 'rgba(0,6,12,0)');
    ctx.fillStyle = g; ctx.fillRect(a.x - a.w, a.y - a.w, a.w * 2, a.w * 2);
  }
  drawHolo(t, a, feather(img));
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(holo, 0, 0); ctx.restore();
  K.glow(ctx, holo, 16, 0.26);
  const I = insetRect(t);
  drawLabels(t, a, b, tb, I);
  drawHandoff(t, a, I, img);
  drawInset(t, I, img);
  drawText(t);
  K.vignette(ctx, 0.3);
  K.grain(ctx, t, 0.05);
};
window.ready = true;
</script></body></html>
