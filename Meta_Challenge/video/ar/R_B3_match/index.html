<!doctype html>
<!-- Act 1 intro, variant R_B3_lines "Planet, eye, kid".
     One continuous overhead pull-back in the film's glowing-line language, warm gold on deep dusk:
     a line-drawn Earth turning in the dark -> it is the reflection in a kid's pupil -> iris, lashes, lids ->
     face -> the whole kid lying in a field of glowing grass, looking straight up at the sky we are in.
     Real perspective (camera height = F / zoom), so grass and hair separate in depth as we rise.
     Pure function of t: window.renderFrame(t). Seeded, no clocks. -->
<html>
<head>
<meta charset="utf-8">
<title>Act 1 · R_B3_lines · Planet, eye, kid</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script>
(async () => {
  const { W, H, clamp, lerp, prog, ease, hash, hash2, noise } = K;
  const cv = document.getElementById('c'), M = cv.getContext('2d');
  const cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
  await K.loadFonts();
  const TAU = Math.PI * 2, DEG = Math.PI / 180, rgba = K.rgba;
  const C = { gold: '#ffc247', pale: '#ffd98a', amber: '#ff9d2e', cream: '#ffe9b8', rose: '#ffb48a' };
  const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };

  const L = K.layer(), Lg = L.getContext('2d');
  const HB = K.layer(), Hb = HB.getContext('2d');        // scratch for one-pass blurred hair shapes          // everything drawn (fills occlude, lines glow)
  const TX = K.layer(), Tg = TX.getContext('2d');        // question, before its write-on mask

  // background: deep dusk ground, warm from the low sun (upper left), plum in the far corner
  const BG = K.layer(), Bg = BG.getContext('2d');
  {
    let g = Bg.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#22120a'); g.addColorStop(0.45, '#120a0a'); g.addColorStop(1, '#0a060c');
    Bg.fillStyle = g; Bg.fillRect(0, 0, W, H);
    g = Bg.createRadialGradient(-80, -60, 0, -80, -60, 1500);
    g.addColorStop(0, 'rgba(255,150,70,0.22)'); g.addColorStop(0.5, 'rgba(255,120,60,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    Bg.fillStyle = g; Bg.fillRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------------------------------------------------
  // camera. World units: px at zoom 1 (S px per cm). The face plane is h = 0, ground is h = -25 cm.
  // Camera looks straight down from height Hc = F / z above the face, so lower things zoom less (real parallax).
  const S = 5.2, F = 3000, GROUND = -25;
  const CF = cfg.camera, T1 = CF.settle, TH_F = CF.rot, EF = CF.eyeFinal, ZE = CF.zEnd || 1;
  const EYE = [-3.1 * S, 0];
  const Z0 = 1150 / (0.27 * S);                           // the pupil just overfills the frame on frame 1
  const A_ = 0.22, E = u => (3 * u * u - 2 * u * u * u + A_ * (1 - (1 - u) ** 3) / 3) / (1 + A_ / 3);
  let CAM;
  function setCam(t) {
    const u = clamp(t / T1), e = E(u), hold = Math.max(0, t - T1);
    const z = Math.exp(Math.log(Z0) * (1 - e) + Math.log(ZE) * e) * (1 - 0.008 * hold);
    const th = TH_F * ease.inOut(u) - 0.004 * hold;
    const c = Math.cos(th), s = Math.sin(th);
    const ox = (EF[0] - 960) * e, oy = (EF[1] - 540) * e;
    const Nx = EYE[0] - (c * ox + s * oy) / z, Ny = EYE[1] - (-s * ox + c * oy) / z;
    CAM = { z, th, c, s, Nx, Ny, Hc: F / z, t };
  }
  const P = (x, y, h) => {                                  // world px -> screen
    const d = CAM.Hc - h; if (d < 0.5) return null;
    const k = F / d, dx = x - CAM.Nx, dy = y - CAM.Ny;
    return [960 + k * (CAM.c * dx - CAM.s * dy), 540 + k * (CAM.s * dx + CAM.c * dy), k];
  };
  const useH = (g, hcm) => {                                // set g so local units are cm at height hcm; returns px per cm
    const d = CAM.Hc - hcm * S; if (d < 0.5) return 0;
    const k = F / d, sc = k * S;
    const ex = 960 - k * (CAM.c * CAM.Nx - CAM.s * CAM.Ny), ey = 540 - k * (CAM.s * CAM.Nx + CAM.c * CAM.Ny);
    g.setTransform(sc * CAM.c, sc * CAM.s, -sc * CAM.s, sc * CAM.c, ex, ey); return sc;
  };

  // ---------------------------------------------------------------------------------------------------------
  // drawing helpers (local units)
  const cr = (pts, closed, seg = 6) => {                   // Catmull-Rom -> dense polyline
    const out = [], n = pts.length, N = closed ? n : n - 1;
    for (let i = 0; i < N; i++) {
      const p0 = closed ? pts[(i - 1 + n) % n] : pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[(i + 1) % n];
      const p3 = closed ? pts[(i + 2) % n] : pts[Math.min(n - 1, i + 2)];
      for (let k = 0; k < seg; k++) {
        const u = k / seg, u2 = u * u, u3 = u2 * u, f = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3);
        out.push([f(0), f(1)]);
      }
    }
    if (!closed) out.push(pts[n - 1].slice());
    return out;
  };
  // tapered pen stroke: filled ribbon, width w (local units), thin at both ends
  function ribbon(g, pts, w, a0 = 0.2, a1 = 0.8, minw = 0.2) {
    const n = pts.length; if (n < 2) return;
    const cum = [0]; for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const Lt = cum[n - 1] || 1, Lf = [], Rt = [];
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[Math.min(n - 1, i + 1)], o = pts[Math.max(0, i - 1)];
      let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const u = cum[i] / Lt, f = Math.max(0, Math.min(1, a0 > 0 ? u / a0 : 1, a1 < 1 ? (1 - u) / (1 - a1) : 1));
      const ww = w * 0.5 * (minw + (1 - minw) * Math.pow(f, 0.7));
      Lf.push([p[0] - dy * ww, p[1] + dx * ww]); Rt.push([p[0] + dy * ww, p[1] - dx * ww]);
    }
    g.beginPath(); g.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) g.lineTo(Lf[i][0], Lf[i][1]);
    for (let i = n - 1; i >= 0; i--) g.lineTo(Rt[i][0], Rt[i][1]); g.closePath(); g.fill();
  }
  // rim-lit outline of a closed shape: edges facing the low sun glow, the far side fades to nothing
  const LW = [-0.46, -0.87];                               // direction towards the sun, world space
  function rim(g, pts, w, lo, hi, col, pred, mul = 1, wv = 0.55) {
    const n = pts.length; let A = 0;
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; A += p[0] * q[1] - q[0] * p[1]; }
    g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
    let cur = -1, path = null;
    const flush = () => { if (path && cur > 0) { g.strokeStyle = rgba(col, mul * cur / 10); g.lineWidth = w * (1 - wv + wv * 1.4 * cur / 10); g.stroke(path); } path = null; };
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      if (pred && !pred(p)) { flush(); cur = -1; continue; }
      let dx = q[0] - p[0], dy = q[1] - p[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const nx = A > 0 ? dy : -dy, ny = A > 0 ? -dx : dx;
      const d = nx * LW[0] + ny * LW[1], a = lo + (hi - lo) * sm((d + 0.35) / 1.25), lvl = Math.round(a * 10);
      if (lvl !== cur || !path) { flush(); cur = lvl; path = new Path2D(); path.moveTo(p[0], p[1]); }
      path.lineTo(q[0], q[1]);
    }
    flush();
  }
  const inPoly = (pts, x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
  const outside = (...polys) => p => !polys.some(q => inPoly(q, p[0], p[1]));
  const fillPoly = (g, pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); };
  const strokePoly = (g, pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); };
  // a limb: centre line + widths -> closed smooth outline with round ends
  const segX = (a, b, c, d) => {
    const rx = b[0] - a[0], ry = b[1] - a[1], sx = d[0] - c[0], sy = d[1] - c[1], den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return null;
    const u = ((c[0] - a[0]) * sy - (c[1] - a[1]) * sx) / den, v = ((c[0] - a[0]) * ry - (c[1] - a[1]) * rx) / den;
    return (u >= 0 && u <= 1 && v >= 0 && v <= 1) ? [a[0] + u * rx, a[1] + u * ry] : null;
  };
  function unloop(p) {
    const out = []; let i = 0;
    while (i < p.length - 1) {
      out.push(p[i]); let hit = null, hj = -1;
      for (let j = Math.min(p.length - 2, i + 90); j >= i + 2; j--) { const x = segX(p[i], p[i + 1], p[j], p[j + 1]); if (x) { hit = x; hj = j; break; } }
      if (hit) { out.push(hit); i = hj + 1; } else i++;
    }
    out.push(p[p.length - 1]); return out;
  }
  function limb(cl, wd) {
    const c = cr(cl, false, 8), n = c.length, wv = i => { const u = i / (n - 1) * (wd.length - 1), k = Math.min(wd.length - 2, Math.floor(u)); return lerp(wd[k], wd[k + 1], u - k) / 2; };
    const Lf = [], Rt = [];
    for (let i = 0; i < n; i++) {
      const p = c[i], q = c[Math.min(n - 1, i + 1)], o = c[Math.max(0, i - 1)];
      let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const w = wv(i); Lf.push([p[0] - dy * w, p[1] + dx * w]); Rt.push([p[0] + dy * w, p[1] - dx * w]);
    }
    const cap = (p, a0, r, out) => { for (let k = 1; k < 10; k++) { const a = a0 - Math.PI * k / 10; out.push([p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r]); } };
    const Lc = unloop(Lf), Rc = unloop(Rt); Lf.length = 0; Lf.push(...Lc); Rt.length = 0; Rt.push(...Rc);
    const out = Lf.slice();
    { const p = c[n - 1], q = c[n - 2], a = Math.atan2(p[1] - q[1], p[0] - q[0]); cap(p, a + Math.PI / 2, wv(n - 1), out); }
    for (let i = Rt.length - 1; i >= 0; i--) out.push(Rt[i]);
    { const p = c[0], q = c[1], a = Math.atan2(p[1] - q[1], p[0] - q[0]); cap(p, a + Math.PI / 2, wv(0), out); }
    return out;
  }
  const mirror = pts => pts.map(p => [-p[0], p[1]]);

  // ---------------------------------------------------------------------------------------------------------
  // THE KID (cm, origin between the eyes, body along +y). Lying on his back, arms behind his head,
  // right knee up, looking straight up at the camera.
  const FACE = cr([[0, -9.2], [4.6, -8.2], [6.3, -5.2], [6.7, -1.5], [6.6, 1.5], [6.1, 4.4], [5.0, 6.9], [3.2, 8.4], [1.4, 9.3], [0, 9.5],
    [-1.4, 9.3], [-3.2, 8.4], [-5.0, 6.9], [-6.1, 4.4], [-6.6, 1.5], [-6.7, -1.5], [-6.3, -5.2], [-4.6, -8.2]], true, 6);
  const EARL = cr([[-6.3, -1.0], [-7.3, -1.5], [-8.0, -0.4], [-8.1, 1.3], [-7.7, 3.0], [-6.8, 3.9], [-6.1, 3.4]], true, 5);
  const EARLin = cr([[-7.1, -0.5], [-7.5, 0.9], [-7.2, 2.4], [-6.8, 3.0]], false, 6);
  const HAIRB = cr([[-7.6, 3.4], [-9.8, 1.0], [-11.0, -3], [-10.8, -7.5], [-8.8, -11.5], [-5, -14.2], [0, -15.0], [5, -14.3], [8.9, -11.6],
    [10.9, -7.4], [11.0, -3], [9.9, 1.0], [7.6, 3.4], [6, -1], [0, -6], [-6, -1]], true, 6);
  const NECK = cr([[-3.4, 8.0], [-3.6, 13.8], [-1.5, 15.0], [1.5, 15.0], [3.6, 13.8], [3.4, 8.0]], true, 4);
  const TORSO = cr([[-5.4, 12.5], [-10, 13.2], [-14.4, 15.0], [-16.4, 18.6], [-15.4, 24], [-13.7, 32], [-12.9, 40], [-13.3, 46], [-13.9, 50.4], [-7, 51.1],
    [0, 51.3], [7, 51.1], [13.9, 50.4], [13.3, 46], [12.9, 40], [13.7, 32], [15.4, 24], [16.4, 18.6], [14.4, 15.0], [10, 13.2], [5.4, 12.5],
    [3, 14.4], [0, 15.1], [-3, 14.4]], true, 5);
  const ARM = limb([[-14.2, 17.5], [-17.5, 8], [-20.4, -0.8], [-22.0, -5.6], [-20.2, -9.0], [-14.5, -10.6], [-9.0, -10.2]], [7.2, 6.9, 5.9, 5.5, 5.0, 4.6, 4.2]);
  const SLEEVE = limb([[-13.8, 17.6], [-15.9, 12.4], [-17.8, 7.6]], [8.4, 8.0, 7.7]);
  const HEM = { H: [-17.1, 9.6], d: [-0.379, -0.926] };                                    // sleeve hem point + arm direction
  const hp = (a, b) => [HEM.H[0] + (-HEM.d[1]) * a + HEM.d[0] * b, HEM.H[1] + HEM.d[0] * a + HEM.d[1] * b];   // a across the arm, b along it
  const HEMLINE = cr([hp(4.5, -0.1), hp(2.6, 0.45), hp(0, 0.62), hp(-2.6, 0.45), hp(-4.5, -0.1)], false, 6);   // hem bows round the arm
  const HEMCLIP = HEMLINE.concat([hp(-20, -0.1), hp(-20, -30), hp(20, -30), hp(20, -0.1)]);
  const LEGL = limb([[-7.2, 58], [-7.4, 70], [-7.4, 81], [-7.3, 90], [-7.1, 100], [-7.0, 107]], [11.4, 10.2, 8.4, 8.2, 6.8, 5.6]);
  const LEGR = limb([[9.6, 56], [16.6, 65.6], [22.6, 72.4], [21.2, 77.6], [16.6, 86.6], [12, 94.6]], [11.6, 10.4, 9.0, 8.4, 7.4, 5.8]);
  const SHORTS = cr([[-13.3, 48.6], [13.3, 48.6], [14.6, 54], [18.3, 57.8], [12.8, 62.6], [9.5, 64.6], [3.5, 60.5], [0, 61], [-1.4, 65],
    [-7, 65.6], [-12.8, 64.4], [-13.8, 56]], true, 5);
  const SHOEL = cr([[-11.4, 106], [-12.4, 110], [-12.6, 114.5], [-11.4, 118.4], [-8.6, 120.2], [-5.4, 119.4], [-3.6, 116], [-3.4, 111], [-4.4, 106.5], [-7.8, 105.2]], true, 5);
  const SHOER = cr([[8.0, 95], [8.2, 101], [8.6, 108], [9.0, 113.5], [10.6, 117.2], [13.4, 118.4], [16.0, 116.6], [16.8, 111.6], [16.4, 104], [15.6, 97.5], [14.2, 93.6], [11.2, 92.6]], true, 5);

  // hair: strands from the hairline, lying out on the grass around the head
  const RH = K.mulberry(611);
  const STRANDS = Array.from({ length: 300 }, (_, i) => {
    const ph = lerp(-Math.PI - 0.32, 0.32, (i + RH() * 0.9) / 300), rr = 0.9 + 0.12 * RH();
    const root = [6.5 * rr * Math.cos(ph), -1.8 + 7.6 * rr * Math.sin(ph)];
    const rx = root[0] / 6.5, ry = (root[1] + 1.5) / 7.6, lock = noise(ph * 2.6, 41), out = Math.atan2(ry - 0.75, rx * 0.8) + 0.5 * lock + (RH() - 0.5) * 0.12, len = 3.2 + 3.0 * Math.pow(RH(), 0.6);
    const bend = 1.1 * noise(ph * 2.6 + 7, 43) + (RH() - 0.5) * 0.18;
    return { root, out, len, bend, w: 0.028 + 0.035 * RH(), a: 0.2 + 0.4 * RH(), ph: RH() * 9, gold: RH() < 0.55 };
  });
  const FRINGE = Array.from({ length: 34 }, (_, i) => {
    const x0 = lerp(-5.4, 4.8, i / 33) + (RH() - 0.5) * 0.7, sw = 0.9 + RH() * 1.4;
    return { p: [[x0 + 0.4, -10.2], [x0 - 0.3 * sw, -8.0], [x0 - sw, -6.0 - RH() * 0.8], [x0 - sw * 1.25, -5.2 - RH() * 0.6]], w: 0.026 + 0.03 * RH(), a: 0.25 + 0.4 * RH() };
  });

  // HAIR, round 3: a soft dark mass, 8 clumped locks falling back onto the grass under gravity, a few strays,
  // and a short fringe of 3 locks. Gold only as rim light on the sun-side edges.
  const HAIRM = cr([[-7.0, 2.6], [-8.3, 0.2], [-8.9, -3.4], [-8.5, -7.0], [-6.9, -10.0], [-3.9, -11.9], [0.2, -12.5], [4.2, -11.8], [7.1, -9.8],
    [8.6, -6.8], [8.9, -3.3], [8.2, 0.2], [7.0, 2.6], [5.8, -1.4], [0, -6], [-5.8, -1.4]], true, 6);
  const lockShape = (B, a, Lk, wk, curl, n = 14) => {         // tapered clump: wide root, soft pointed tip, gentle curl
    const d = [Math.cos(a), Math.sin(a)], q = [-d[1], d[0]];
    const cl = cr([B, [B[0] + d[0] * Lk * 0.45 + q[0] * curl * 0.25, B[1] + d[1] * Lk * 0.45 + q[1] * curl * 0.25], [B[0] + d[0] * Lk + q[0] * curl, B[1] + d[1] * Lk + q[1] * curl]], false, n / 2);
    const m = cl.length, Lf = [], Rt = [];
    for (let i = 0; i < m; i++) {
      const p = cl[i], nx = cl[Math.min(m - 1, i + 1)], pv = cl[Math.max(0, i - 1)];
      let dx = nx[0] - pv[0], dy = nx[1] - pv[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const u = i / (m - 1), hw = wk / 2 * Math.pow(Math.max(0, 1 - Math.pow(u, 2.4)), 0.55) * (0.85 + 0.15 * Math.sin(Math.PI * u));
      Lf.push([p[0] - dy * hw, p[1] + dx * hw]); Rt.push([p[0] + dy * hw, p[1] - dx * hw]);
    }
    return { out: Lf.concat(Rt.reverse()), cl, wk };
  };
  const RL = K.mulberry(733);
  // [angle round the head, length, width, curl]; all curl the same way (a soft swirl), longer behind the head
  const LOCKS = [[-2.95, 4.0, 4.2, 1.1], [-2.55, 5.4, 4.8, 1.5], [-2.15, 6.2, 5.0, 1.2], [-1.8, 6.6, 5.2, 1.7], [-1.45, 6.0, 5.0, 1.0],
    [-1.1, 6.4, 5.2, 1.6], [-0.75, 5.6, 4.8, 1.2], [-0.4, 5.0, 4.4, 1.5], [-0.08, 3.8, 3.8, 0.9]].map(([a, Lk, wk, curl], i) => {
    const B = [Math.cos(a) * 5.6, -2.8 + Math.sin(a) * 6.6], dir = a + 0.15 * (RL() - 0.5) + 0.12;
    const sh = lockShape(B, dir, Lk * 0.88, wk, curl * (1.1 + 0.4 * RL())), cl = sh.cl, m = cl.length;
    const sunny = Math.cos(dir) * LW[0] + Math.sin(dir) * LW[1];
    const strands = Array.from({ length: 9 }, (_, k) => {
      const o = (k / 8 - 0.5) * 0.9 + (RL() - 0.5) * 0.08, lf = 0.72 + 0.28 * RL(), jit = (RL() - 0.5) * 0.5;
      const pts = [];
      for (let j = 0; j < m; j++) {
        const u = j / (m - 1); if (u > lf) break;
        const p = cl[j], nx = cl[Math.min(m - 1, j + 1)], pv = cl[Math.max(0, j - 1)], dx = nx[0] - pv[0], dy = nx[1] - pv[1], l = Math.hypot(dx, dy) || 1;
        const off = o * wk * (0.42 + 0.58 * Math.pow(1 - u, 1.1)) + o * 0.9 * u * u + jit * Math.sin(Math.PI * u) * 0.5;
        pts.push([p[0] - dy / l * off, p[1] + dx / l * off]);
      }
      // the edge strand facing the sun catches the light; the rest stay dark
      const edge = (o > 0 ? 1 : -1) * Math.sign(-Math.sin(dir) * LW[0] + Math.cos(dir) * LW[1]) > 0 ? Math.abs(o) / 0.45 : 0;
      return { pts, a: 0.13 + 0.12 * RL() + 0.32 * sm(edge) * sm((sunny + 0.4) / 1.2) };
    });
    return { ...sh, strands, ph: RL() * 9 };

      g.strokeStyle = rgba(C.gold, 0.35); g.lineWidth = Math.max(0.6, Math.min(2.4, pup / 300)); g.beginPath(); g.arc(c[0], c[1], pup, 0, TAU); g.stroke();
      // catchlight: the bright evening sky, a soft window up-left on the iris (same side in both eyes)
      const cl = [exx - 0.24, -0.23], q = P(cl[0] * S, cl[1] * S, 0), r = Math.min(0.055 * sc, 38);
      if (q && r > 0.6) {
        const gr = g.createRadialGradient(q[0], q[1], 0, q[0], q[1], r * 1.5);
        gr.addColorStop(0, 'rgba(255,246,220,0.9)'); gr.addColorStop(0.45, 'rgba(255,236,190,0.6)'); gr.addColorStop(1, 'rgba(255,220,160,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(q[0], q[1], r * 1.5, 0, TAU); g.fill();
      }
      g.restore();
    }
    sc = useH(g, 0);
    drawEyeLids(g, -3.1, -1, t, sc, ZE); drawEyeLids(g, 3.1, 1, t, sc, ZE);
    // brows (a touch raised: wonder), nose, mouth
    const wb = v => v * (1 + 0.8 * ZK);
    det(cr([[-5.3, -2.3], [-3.7, -3.2], [-1.7, -3.0]], false, 6), 0, C.gold, 0.55, wb(2.6), 0.2, 0.7);
    det(cr([[5.3, -2.3], [3.7, -3.2], [1.7, -3.0]], false, 6), 0, C.gold, 0.4, wb(2.6), 0.2, 0.7);
    det(cr([[-1.25, 3.0], [-1.5, 3.5], [-1.1, 3.9], [-0.55, 3.85]], false, 5), 0, C.gold, 0.45, wb(1.4));
    det(cr([[1.25, 3.0], [1.5, 3.5], [1.1, 3.9], [0.55, 3.85]], false, 5), 0, C.gold, 0.3, wb(1.4));
    det(cr([[-0.5, 4.1], [0, 4.25], [0.5, 4.1]], false, 4), 0, C.gold, 0.25, wb(1.1));
    det(cr([[0.85, -0.9], [1.0, 1.0], [1.2, 2.6]], false, 5), 0, C.gold, 0.16, wb(1.2), 0.3, 0.6);
    det(cr([[-1.9, 6.1], [-0.9, 6.15], [0, 6.35], [0.9, 6.15], [1.9, 6.1]], false, 6), 0, C.rose, 0.55, wb(1.7), 0.2, 0.8);
    det(cr([[-0.95, 7.05], [0, 7.3], [0.95, 7.05]], false, 5), 0, C.rose, 0.22, wb(1.2));
    // fringe falling over the forehead
    sc = useH(g, 0.5);
    if (sc) {
      softFill(FRSHAPE, 0.3 * sc, 0.8);
      for (const f of FRSTR) { g.fillStyle = rgba(C.gold, f.a); ribbon(g, f.pts, Math.max(0.03, 0.85 / sc), 0.05, 0.5, 0.2); }
    }
  }

  // ---------------------------------------------------------------------------------------------------------
  // the question
  const Q = cfg.text, QT = cfg.timing.question;
  let QFS = Q.size; Tg.font = `700 ${QFS}px Caveat`;
  QFS = Math.floor(QFS * Math.min(1, 940 / Tg.measureText(Q.q).width)); Tg.font = `700 ${QFS}px Caveat`;
  const QW = Tg.measureText(Q.q).width;
  const QH = Tg.measureText(Q.q.split(' ')[0] + ' ').width;
  function drawQuestion(g, t) {
    const e = prog(t, QT[0], QT[3]); if (e <= 0) return;
    const [cx, cy] = Q.pos, x0 = cx - QW / 2, y = cy + 10 * (1 - ease.out3(prog(t, QT[0], QT[1] + 0.3)));
    const eH = ease.inOut(prog(t, QT[0], QT[1])), eR = ease.inOut(prog(t, QT[2], QT[3]));
    // a soft darkening behind the words so they sit calmly on the grass
    g.setTransform(1, 0, 0, 1, 0, 0);
    const gr = g.createRadialGradient(cx, cy - QFS * 0.3, 0, cx, cy - QFS * 0.3, QW * 0.7);
    gr.addColorStop(0, `rgba(10,5,5,${0.8 * sm(e * 4)})`); gr.addColorStop(0.55, `rgba(10,5,5,${0.55 * sm(e * 4)})`); gr.addColorStop(1, 'rgba(10,5,5,0)');
    g.save(); g.translate(cx, cy - QFS * 0.3); g.scale(1, 0.36); g.translate(-cx, -(cy - QFS * 0.3)); g.fillStyle = gr; g.fillRect(cx - QW, cy - QFS * 0.3 - QW, QW * 2, QW * 2); g.restore();
    Tg.setTransform(1, 0, 0, 1, 0, 0); Tg.globalCompositeOperation = 'source-over'; Tg.clearRect(0, 0, W, H);
    Tg.font = `700 ${QFS}px Caveat`; Tg.textBaseline = 'alphabetic'; Tg.textAlign = 'left';
    Tg.fillStyle = rgba(C.cream, 0.95 * sm(prog(t, QT[0], QT[1] - 0.1))); Tg.fillText(Q.q, x0, y);
    // write-on: a soft edge moving left to right. It drifts slowly across the first word, rests, then writes the rest.
    const edge = eR > 0 ? lerp(x0 + QH + 60, x0 + QW + 170, eR) : lerp(x0 + 40, x0 + QH + 60, eH);
    Tg.globalCompositeOperation = 'destination-in';
    const mg = Tg.createLinearGradient(edge - 170, 0, edge, 0); mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
    Tg.fillStyle = mg; Tg.fillRect(0, 0, W, H); Tg.globalCompositeOperation = 'source-over';
    g.drawImage(TX, 0, 0);
  }

  // bloom from the bright lines only: the quarter-res copy is multiplied by itself (dark fills -> ~0), then blurred
  const GQ = K.layer(W / 4, H / 4), Gq = GQ.getContext('2d'), GQ2 = K.layer(W / 4, H / 4), Gq2 = GQ2.getContext('2d'), GQ3 = K.layer(W / 4, H / 4), Gq3 = GQ3.getContext('2d');
  let gqFor = -1;
  function glow(src, radius, strength) {
    if (gqFor !== CAM.t) {
      Gq.globalCompositeOperation = 'source-over'; Gq.clearRect(0, 0, W / 4, H / 4); Gq.imageSmoothingQuality = 'high'; Gq.drawImage(src, 0, 0, W / 4, H / 4);
      Gq2.clearRect(0, 0, W / 4, H / 4); Gq2.drawImage(GQ, 0, 0);
      Gq.globalCompositeOperation = 'multiply'; Gq.drawImage(GQ2, 0, 0); Gq.globalCompositeOperation = 'source-over';
      gqFor = CAM.t;
    }
    Gq3.clearRect(0, 0, W / 4, H / 4); Gq3.filter = `blur(${radius / 4}px)`; Gq3.drawImage(GQ, 0, 0); Gq3.filter = 'none';
    M.save(); M.setTransform(1, 0, 0, 1, 0, 0); M.globalCompositeOperation = 'lighter'; M.globalAlpha = strength; M.imageSmoothingQuality = 'high';
    M.drawImage(GQ3, 0, 0, W, H); M.restore();
  }

  // ---------------------------------------------------------------------------------------------------------
  const MR = K.layer(), MRg = MR.getContext('2d');
  window.renderFrame = t => {
    setCam(t);
    const ZK = clamp(Math.log10(Math.max(1, CAM.z)) / 2.2);
    M.setTransform(1, 0, 0, 1, 0, 0); M.globalCompositeOperation = 'source-over'; M.globalAlpha = 1; M.filter = 'none';
    M.drawImage(BG, 0, 0);
    const g = Lg; g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.clearRect(0, 0, W, H);
    if (CAM.z < 40) drawGrass(g, t, BLADES, clamp(Math.log10(Math.max(1, CAM.z * 0.6)) / 1.6), false);
    drawKid(g, t, ZK);
    if (CAM.z < 40) drawGrass(g, t, OVER, clamp(Math.log10(Math.max(1, CAM.z * 0.6)) / 1.6), true);
    // a few drifting evening motes between us and him
    g.setTransform(1, 0, 0, 1, 0, 0);
    for (const m of MOTES) {
      const q = P(m.x + 14 * Math.sin(t * 0.5 + m.ph), m.y + 10 * Math.cos(t * 0.4 + m.ph), m.h); if (!q) continue;
      const dist = CAM.Hc - m.h; if (dist < 80) continue;
      const a = 0.55 * sm((dist - 80) / 300) * (0.6 + 0.4 * Math.sin(t * 1.7 + m.ph * 3));
      g.fillStyle = rgba(C.cream, a); g.beginPath(); g.arc(q[0], q[1], Math.min(5, 1.6 * q[2] / CAM.z + 0.6), 0, TAU); g.fill();
    }
    drawDandelions(g, t);
    // R_B3_match: mirror the drawn world (not the question) so the kid's last pose lands on the real man's pose
    if (CF.mirror) { MRg.setTransform(1, 0, 0, 1, 0, 0); MRg.clearRect(0, 0, W, H); MRg.setTransform(-1, 0, 0, 1, W, 0); MRg.drawImage(L, 0, 0);
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.drawImage(MR, 0, 0); }
    drawQuestion(g, t);
    M.drawImage(L, 0, 0);
    // last light: warm wash from the low sun, and a soft pool around him (only once we are out over the field)
    {
      const f = sm(1 - Math.log10(Math.max(1, CAM.z)) / 1.3);
      if (f > 0) {
        M.save(); M.setTransform(1, 0, 0, 1, 0, 0); M.globalCompositeOperation = 'lighter';
        const kc = P(2 * S, 50 * S, -15 * S) || [960, 540];
        if (CF.mirror) kc[0] = W - kc[0];
        let gr = M.createRadialGradient(kc[0], kc[1], 0, kc[0], kc[1], 760);
        gr.addColorStop(0, `rgba(255,150,70,${0.11 * f})`); gr.addColorStop(1, 'rgba(255,150,70,0)');
        M.fillStyle = gr; M.fillRect(0, 0, W, H);
        gr = M.createRadialGradient(-150, -120, 0, -150, -120, 1500);
        gr.addColorStop(0, `rgba(255,170,90,${0.16 * f})`); gr.addColorStop(0.6, `rgba(255,140,70,${0.04 * f})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        M.fillStyle = gr; M.fillRect(0, 0, W, H);
        M.restore();
      }
    }
    glow(L, 12, 1.0); glow(L, 56, 0.6);
    K.vignette(M, 0.5, '10,4,8');
    K.grain(M, t, 0.05);
  };
  window.renderFrame(0);
  window.ready = true;
})();
</script>
