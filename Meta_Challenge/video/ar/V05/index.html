<!doctype html>
<!-- V05: grey world; at the pinch, colour spreads out from the two lenses in a soft ring lit with thin cyan/amber light,
     and the glasses hologram (object `glasses`) turns life-size beside the head. window.renderFrame(t), pure in t.
     All positions (lenses, hologram, push centre) are in plate px (the vf-cropped 1920x1080 frame) in config.json. -->
<html><head><meta charset="utf-8"><title>V05 colour from the lenses</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
<script type="importmap">{"imports":{"three":"/app/render3d/node_modules/three/build/three.module.js","three/addons/":"/app/render3d/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="/video/act1/lib/kit.js"></script>
<script type="module">
import { hologram } from '../lib/holo.js';
const W = 1920, H = 1080, CY = '#4df0ff', AM = '#ffc247';
const ctx = document.getElementById('c').getContext('2d');
const cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
await K.loadFonts(); await K.loadFootage();
const h = await hologram('glasses', { scale: 2 });
const E = K.ease;
// Beside a real head, the app's ghost eye and band-hand read as clutter: reload the same spec without them,
// and without the battery label (it collides with Projector). Read-only: the spec is cloned, app/ is untouched.
{
  const drop = new Set(cfg.dropParts || []), keep = x => !drop.has(typeof x === 'string' ? x : x?.to ?? x?.on);
  const spec = structuredClone(h.chapter.spec);
  spec.parts = spec.parts.filter(p => !drop.has(p.id));
  for (const b of spec.beats) for (const k of ['ghost', 'focus', 'explodeOnly', 'labels', 'play', 'callouts', 'fx'])
    if (Array.isArray(b[k])) b[k] = b[k].filter(keep);
  if (spec.beats[1]?.labels) spec.beats[1].labels = spec.beats[1].labels.filter(id => !(cfg.dropLabels || []).includes(id));
  h.explore.load(spec);
}
const key = (a, t) => { // linear between keyframes
  let i = 0; while (i < a.length - 2 && t > a[i + 1].t) i++;
  const p = a[i], q = a[Math.min(i + 1, a.length - 1)], u = q.t > p.t ? K.clamp((t - p.t) / (q.t - p.t)) : 0;
  return Object.fromEntries(Object.keys(p).map(k => [k, K.lerp(p[k], q[k], u)]));
};
const L = () => K.layer(W, H);
const src = L(), grey = L(), col = L(), mask = L(), ring = L(), holo = L();

// ---- code-drawn stand-in (only when the real plate is missing): event hall bokeh + a head with glasses, built from
//      the lens anchors so the colour ring lines up with it. Drawn in plate coordinates.
function standIn(g, t, ln) {
  const f = cfg.footage.plate;
  K.placeholder(g, f.label, f.sub, { top: '#1d2440', bottom: '#3a1f2a', ink: '#ffe9c8', y: 830 });
  for (let i = 0; i < 26; i++) { // hall lights
    const x = K.hash(i * 3 + 1) * W, y = 120 + K.hash(i * 3 + 2) * 620, r = 30 + K.hash(i * 3 + 3) * 90;
    const hue = ['#ff5ea8', '#ffb547', '#4d9bff', '#9b6bff', '#46e0c8'][i % 5];
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, K.rgba(hue, 0.55)); rg.addColorStop(1, K.rgba(hue, 0));
    g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const cx = (ln.lx + ln.rx) / 2, cy = (ln.ly + ln.ry) / 2, d = ln.rx - ln.lx, sway = 4 * K.noise(t * 0.7, 3);
  g.save(); g.translate(sway, 0);
  g.fillStyle = '#167f86'; g.beginPath(); g.ellipse(cx, cy + d * 2.55, d * 1.9, d * 1.05, 0, Math.PI, 0); g.fill(); // hoodie
  g.fillRect(cx - d * 1.9, cy + d * 2.55, d * 3.8, 400);
  g.fillStyle = '#c0866a'; g.fillRect(cx - d * 0.33, cy + d * 0.9, d * 0.66, d * 0.9); // neck
  g.beginPath(); g.ellipse(cx, cy + d * 0.25, d * 0.92, d * 1.2, 0, 0, Math.PI * 2); g.fill(); // face
  g.fillStyle = '#3b2418'; g.beginPath(); g.ellipse(cx, cy - d * 0.55, d * 0.98, d * 0.62, 0, Math.PI, 0); g.fill(); // hair
  g.fillStyle = '#9c5a4a'; g.beginPath(); g.ellipse(cx, cy + d * 0.9, d * 0.22, d * 0.06, 0, 0, Math.PI * 2); g.fill(); // mouth
  g.strokeStyle = '#151515'; g.lineWidth = 14; g.fillStyle = 'rgba(60,70,80,0.55)';
  for (const [x, y] of [[ln.lx, ln.ly], [ln.rx, ln.ry]]) { g.beginPath(); g.roundRect(x - d * 0.4, y - d * 0.26, d * 0.8, d * 0.52, d * 0.16); g.fill(); g.stroke(); }
  g.beginPath(); g.moveTo(ln.lx + d * 0.4, cy - 4); g.lineTo(ln.rx - d * 0.4, cy - 4); g.stroke();
  g.restore();
}

// soft-edged union of two discs (radius R, feather F) -> alpha mask
function drawMask(g, P, R, F) {
  g.clearRect(0, 0, W, H); g.save(); g.globalCompositeOperation = 'lighter';
  for (const [x, y] of P) {
    const r0 = Math.max(0, R - F), rg = g.createRadialGradient(x, y, r0, x, y, R + 1);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  g.restore();
}
// thin lit edge of the union: cyan on the outer edge, amber just inside; each circle clipped outside the other
function drawRing(g, P, R, F, k) {
  g.clearRect(0, 0, W, H); if (k <= 0) return;
  for (let i = 0; i < 2; i++) {
    const [x, y] = P[i], [ox, oy] = P[1 - i];
    g.save(); g.beginPath(); g.rect(0, 0, W, H); g.arc(ox, oy, R - F * 0.55, 0, Math.PI * 2); g.clip('evenodd');
    g.globalAlpha = k;
    g.strokeStyle = K.rgba(CY, 0.95); g.lineWidth = 2.2; g.beginPath(); g.arc(x, y, R - F * 0.45, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = K.rgba(AM, 0.75); g.lineWidth = 1.4; g.beginPath(); g.arc(x, y, R - F * 0.62, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
}

function text(g, s, x, y, size, a, o = {}) {
  g.save(); g.globalAlpha = a; g.font = `${o.weight || 500} ${o.stretch || 'semi-condensed'} ${size}px Archivo`;
  g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = o.ink || '#f2f4f6';
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 12; g.fillText(s, x, y); g.restore();
}

window.renderFrame = async t => {
  const f = cfg.footage.plate, im = await K.footageFrame('plate', (t - f.start) * (f.speed || 1));
  // gentle push about the head; every config position is in plate px, mapped through the same push
  const pu = cfg.push, z = K.lerp(pu.z0, pu.z1, E.inOut(K.clamp(t / cfg.duration)));
  const P = (x, y) => [pu.x + (x - pu.x) * z, pu.y + (y - pu.y) * z];
  const ln = key(cfg.lenses, t);

  // 1. plate (real frame or stand-in) under the push
  const s = src.getContext('2d'); s.save(); s.clearRect(0, 0, W, H);
  s.translate(pu.x, pu.y); s.scale(z, z); s.translate(-pu.x, -pu.y);
  if (im) s.drawImage(im, 0, 0, W, H); else standIn(s, t, ln);
  s.restore();

  // 2. cold grey world and the warm, curious one
  const gg = grey.getContext('2d'); gg.save();
  gg.filter = 'grayscale(1) contrast(1.06) brightness(0.8)'; gg.drawImage(src, 0, 0); gg.filter = 'none';
  gg.globalCompositeOperation = 'multiply'; gg.fillStyle = '#b4c3d6'; gg.fillRect(0, 0, W, H); gg.restore();
  const cg = col.getContext('2d'); cg.save(); cg.globalCompositeOperation = 'copy';
  cg.filter = 'saturate(1.18) contrast(1.04) brightness(1.03)'; cg.drawImage(src, 0, 0); cg.filter = 'none';
  cg.globalCompositeOperation = 'soft-light'; cg.fillStyle = K.rgba(AM, 0.22); cg.fillRect(0, 0, W, H); cg.restore();

  // 3. colour spreads from the lenses
  const rc = cfg.ring, u = K.prog(t, rc.start, rc.end), L2 = [P(ln.lx, ln.ly), P(ln.rx, ln.ry)];
  const R = u > 0 ? K.lerp(ln.r * z, rc.r1, E.inOut3(u) * 0.88 + E.out3(u) * 0.12) : 0, F = K.lerp(40, rc.feather, K.clamp(u * 3));
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(grey, 0, 0);
  if (R > 0) {
    drawMask(mask.getContext('2d'), L2, R, F);
    cg.save(); cg.globalCompositeOperation = 'destination-in'; cg.drawImage(mask, 0, 0); cg.restore();
    ctx.drawImage(col, 0, 0);
  }
  // lens pre-glow at the pinch, and the lit ring edge while it travels
  const pg = K.prog(t, cfg.trigger - 0.15, cfg.trigger + 0.25) * (1 - K.prog(t, rc.start + 0.2, rc.start + 0.9));
  if (pg > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const [x, y] of L2) {
      const r = ln.r * z * 1.25, rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, K.rgba(CY, 0.32 * pg)); rg.addColorStop(0.7, K.rgba(CY, 0.12 * pg)); rg.addColorStop(1, K.rgba(CY, 0));
      ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    ctx.restore();
  }
  const rk = K.prog(t, rc.start, rc.start + 0.25) * (1 - E.in2(K.prog(u, 0.55, 1)));
  if (rk > 0) {
    drawRing(ring.getContext('2d'), L2, R, F, rk);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(ring, 0, 0); ctx.restore();
    K.glow(ctx, ring, 14, 0.55);
  }

  // 4. the glasses hologram, life-size beside the head
  const a = key(cfg.anchor, t), bs = cfg.beats;
  if (t >= cfg.anchor[0].t && a.a > 0.001) {
    let bi = 0; while (bi < bs.length - 1 && t >= bs[bi + 1].from) bi++;
    const b = bs[bi].beat, tb = t - bs[bi].from;
    const cv = h.draw(b, tb, { yaw: a.yaw, pitch: 0 });
    const [hx, hy] = P(a.x, a.y), w = a.w * z, sIn = 0.9 + 0.1 * E.out3(K.clamp(a.a));
    const hg = holo.getContext('2d'); hg.save(); hg.globalCompositeOperation = 'copy'; hg.fillStyle = '#000'; hg.fillRect(0, 0, W, H);
    hg.globalCompositeOperation = 'source-over'; hg.translate(hx, hy); hg.rotate(a.rot * Math.PI / 180); hg.scale(sIn, sIn);
    hg.drawImage(cv, -w / 2, -w / 2, w, w); hg.restore();
    hg.save(); hg.globalCompositeOperation = 'multiply'; hg.fillStyle = cfg.holoTint || '#ffffff'; hg.fillRect(0, 0, W, H);
    if (u < 1 && R > 0) { hg.globalCompositeOperation = 'destination-in'; hg.drawImage(mask, 0, 0); } // it arrives with the colour
    hg.restore();
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = E.out2(K.clamp(a.a)); ctx.drawImage(holo, 0, 0); ctx.restore();
    K.glow(ctx, holo, 10, 0.22 * a.a);
    // labels on the explode beat, once parts have landed
    if (b === 1) {
      const la = E.out2(K.prog(tb, 1.7, 2.2)), k = w * sIn / h.size * (h.size / 600);
      if (la > 0) for (const lb of h.labels(b, tb)) {
        const x = hx + (lb.x - 300) * k, y = hy + (lb.y - 300) * k, dir = lb.side === 'l' ? -1 : 1;
        const tx = K.clamp(x + dir * 46, 60, W - 60);
        ctx.save(); ctx.globalAlpha = la; ctx.strokeStyle = K.rgba(CY, 0.8); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.moveTo(x + dir * 5, y); ctx.lineTo(tx - dir * 6, y); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.font = '600 semi-condensed 26px Archivo'; const tw = ctx.measureText(lb.text).width; ctx.restore();
        const tx2 = dir < 0 ? Math.max(60 + tw, tx) : Math.min(W - 60 - tw, tx);
        text(ctx, lb.text, tx2, y + 9, 26, la, { align: dir < 0 ? 'right' : 'left', weight: 600, ink: '#e8fbff' });
      }
    }
  }

  // 5. finish: cold vignette fading warm, grain, captions, small print
  K.vignette(ctx, K.lerp(0.42, 0.3, K.clamp(u)), u < 0.5 ? '8,14,24' : '18,10,4');
  K.grain(ctx, t, 0.06);
  for (const c of cfg.captions) {
    const ca = E.out2(K.prog(t, c.t0, c.t0 + 0.35)) * (1 - K.prog(t, c.t1 - 0.3, c.t1));
    if (ca > 0) text(ctx, c.text, c.x ?? 120, (c.y ?? 140) + 6 * (1 - ca), 40, ca * 0.92, { weight: 500 });
  }
  const sp = cfg.smallprint, sa = E.out2(K.prog(t, sp.t0, sp.t0 + 0.5));
  if (sa > 0) text(ctx, sp.text, W - 64, H - 52, 22, sa * 0.62, { align: 'right', weight: 500 });
};
window.ready = true;
</script></body></html>
