<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Lens emulator</title>
<style>
  :root { --panel: 56; --glow: 1; --x: 62; --y: 58; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font: 500 14px system-ui, sans-serif; color: #eef1f5; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
  /* The glasses display: black is see-through on the real lens, so it is added onto the world with screen blending. */
  #panel { position: fixed; width: calc(var(--panel) * 1vmin); aspect-ratio: 1; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); transform: translate(-50%, -50%); mix-blend-mode: screen; opacity: var(--glow); pointer-events: none; }
  #panel iframe { width: 600px; height: 600px; border: 0; transform-origin: 0 0; background: #000; display: block; }
  #pad { position: fixed; inset: 0; }
  #bar { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; transition: opacity .2s; }
  #bar button, #sheet button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2a3038; background: rgba(20, 24, 29, .72); color: #eef1f5; display: grid; place-items: center; padding: 0; }
  #bar button.on { border-color: #4df0ff; color: #4df0ff; }
  #shot { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: 68px; height: 68px; border-radius: 34px; border: 3px solid #eef1f5; background: rgba(77, 240, 255, .18); transition: opacity .2s; }
  #shot:active { background: rgba(77, 240, 255, .45); }
  #dot { position: fixed; top: max(24px, env(safe-area-inset-top)); left: 16px; width: 10px; height: 10px; border-radius: 5px; background: #6b7280; transition: opacity .2s; }
  #dot.ok { background: #6dff9c; } #dot.bad { background: #ff8a4d; }
  #busy { position: fixed; left: 50%; bottom: max(104px, calc(env(safe-area-inset-bottom) + 80px)); transform: translateX(-50%); width: 120px; height: 3px; border-radius: 2px; background: #2a3038; overflow: hidden; opacity: 0; }
  #busy.on { opacity: 1; } #busy::after { content: ""; position: absolute; width: 40%; height: 100%; background: #4df0ff; animation: run 1s linear infinite; }
  @keyframes run { from { left: -40%; } to { left: 100%; } }
  #sheet { position: fixed; left: 12px; right: 12px; bottom: max(110px, calc(env(safe-area-inset-bottom) + 96px)); padding: 14px 16px; border-radius: 12px; background: rgba(20, 24, 29, .9); border: 1px solid #2a3038; display: none; gap: 12px; }
  #sheet.open { display: grid; }
  #sheet label { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; color: #9aa3ad; }
  #sheet input[type=range] { width: 100%; accent-color: #4df0ff; }
  #sheet .row { display: flex; gap: 8px; align-items: center; }
  #sheet select { background: #14181d; color: #eef1f5; border: 1px solid #2a3038; border-radius: 8px; height: 36px; padding: 0 8px; }
  .ripple { position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 28px; border: 2px solid #4df0ff; pointer-events: none; animation: rip .45s ease-out forwards; }
  .ripple.back { border-color: #ff8a4d; }
  .arrow { position: fixed; pointer-events: none; color: #4df0ff; font-size: 40px; animation: rip .45s ease-out forwards; transform: translate(-50%, -50%); }
  @keyframes rip { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(1.4); } }
  body.clean #bar, body.clean #shot, body.clean #dot { opacity: 0; pointer-events: none; }
  body.clean.ghost .ripple, body.clean.ghost .arrow { display: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #start button { width: 88px; height: 88px; border-radius: 44px; border: 2px solid #4df0ff; background: transparent; color: #4df0ff; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="panel"><iframe id="hud" title="glasses" allow="autoplay"></iframe></div>
<div id="pad" aria-label="Neural band: tap = pinch, swipe = arrows, long press or two fingers = back"></div>
<div id="dot" title="bridge"></div>
<div id="bar">
  <button id="bClean" title="clean" aria-label="Clean view"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button id="bFull" title="fullscreen" aria-label="Fullscreen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bSet" title="settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</div>
<button id="shot" aria-label="Look and explain"></button>
<div id="busy"></div>
<div id="sheet">
  <label title="size"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><input id="sSize" type="range" min="25" max="100" value="56"></label>
  <label title="brightness"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg><input id="sGlow" type="range" min="20" max="100" value="100"></label>
  <label title="horizontal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg><input id="sX" type="range" min="20" max="80" value="62"></label>
  <label title="vertical"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/></svg><input id="sY" type="range" min="20" max="80" value="58"></label>
  <div class="row">
    <button id="bFlip" title="camera" aria-label="Switch camera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><path d="M9 13a3 3 0 0 0 5.2 2M15 13a3 3 0 0 0-5.2-2"/></svg></button>
    <button id="bGhost" title="touches" aria-label="Hide touches in clean view"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/></svg></button>
    <select id="sLang" aria-label="Language"><option>en</option><option>fi</option><option>sv</option><option>de</option><option>es</option><option>fr</option></select>
  </div>
</div>
<div id="start"><button id="go" aria-label="Start camera"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const authHeaders = (h) => (token ? { ...h, 'X-Lens-Token': token } : h);
  const store = { get(k, d) { try { const v = localStorage.getItem('emu.' + k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem('emu.' + k, String(v)); } catch {} } };
  const root = document.documentElement.style;
  const hud = $('hud');
  const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  hud.src = '/?bridge=' + encodeURIComponent(wsUrl) + (token ? '#k=' + encodeURIComponent(token) : '');

  // Panel size and look
  function fit() { const w = $('panel').getBoundingClientRect().width; hud.style.transform = 'scale(' + (w / 600) + ')'; }
  const sliders = { sSize: ['panel', 56], sGlow: ['glow', 100], sX: ['x', 62], sY: ['y', 58] };
  for (const [id, [name, def]] of Object.entries(sliders)) {
    const el = $(id); el.value = store.get(name, def);
    const apply = () => { root.setProperty('--' + name, name === 'glow' ? el.value / 100 : el.value); store.set(name, el.value); fit(); };
    el.addEventListener('input', apply); apply();
  }
  addEventListener('resize', fit);
  $('sLang').value = store.get('lang', 'en');
  $('sLang').addEventListener('change', () => store.set('lang', $('sLang').value));

  // Camera
  let facing = store.get('facing', 'environment'); let stream = null;
  async function camera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      $('cam').srcObject = stream; $('cam').style.transform = facing === 'user' ? 'scaleX(-1)' : '';
    } catch { $('dot').className = 'bad'; }
  }
  $('go').addEventListener('click', async () => {
    $('start').remove(); await camera(); fit();
    try { await navigator.wakeLock?.request('screen'); } catch {}
  });
  $('bFlip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; store.set('facing', facing); camera(); });

  // Neural band: gestures become the glasses app's own keys (arrows = D-pad, Enter = pinch, Escape = back).
  function key(k) {
    const w = hud.contentWindow; if (!w) return;
    // The glasses' document must hold focus, as on the device: the toolkit only fires focused controls.
    if (!document.hasFocus() || document.activeElement !== hud) { try { w.focus(); } catch {} }
    const doc = w.document; const focused = doc.activeElement && doc.activeElement !== doc.body ? doc.activeElement : null;
    const codes = { Enter: 13, Escape: 27, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40 };
    const init = { key: k, code: k, keyCode: codes[k], which: codes[k], bubbles: true, cancelable: true };
    const before = doc.body.innerText.slice(0, 400);
    const target = focused || doc.body;
    target.dispatchEvent(new w.KeyboardEvent('keydown', init));
    target.dispatchEvent(new w.KeyboardEvent('keyup', init));
    // A real pinch selects the focused control. The toolkit arms on the key but does not fire on a synthetic one,
    // so click it, unless the app already reacted to the Enter (the screen changed).
    if (k !== 'Enter' || !focused) return;
    w.requestAnimationFrame(() => w.requestAnimationFrame(() => {
      if (focused.isConnected && doc.activeElement === focused && doc.body.innerText.slice(0, 400) === before) focused.click();
    }));
  }
  function mark(x, y, cls, glyph) {
    const el = document.createElement('div');
    if (glyph) { el.className = 'arrow'; el.textContent = glyph; } else el.className = 'ripple' + (cls ? ' ' + cls : '');
    el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 500);
  }
  const pad = $('pad');
  pad.addEventListener('mousedown', (e) => e.preventDefault()); // a tap must not pull focus out of the glasses
  let down = null; let maxTouches = 0; let longTimer = 0;
  pad.addEventListener('pointerdown', (e) => {
    if (!down) { down = { x: e.clientX, y: e.clientY, t: performance.now(), done: false }; maxTouches = 0; }
    maxTouches += 1;
    clearTimeout(longTimer);
    longTimer = setTimeout(() => { if (down && !down.done) { down.done = true; key('Escape'); mark(down.x, down.y, 'back'); } }, 550);
  });
  pad.addEventListener('pointerup', (e) => {
    clearTimeout(longTimer);
    if (!down) return; const d = down; down = null; if (d.done) return;
    const dx = e.clientX - d.x; const dy = e.clientY - d.y; const dist = Math.hypot(dx, dy);
    if (maxTouches >= 2) { key('Escape'); mark(d.x, d.y, 'back'); return; }
    if (dist < 24) { key('Enter'); mark(d.x, d.y); return; }
    const horizontal = Math.abs(dx) > Math.abs(dy);
    const k = horizontal ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
    key(k); mark(e.clientX, e.clientY, '', { ArrowRight: '›', ArrowLeft: '‹', ArrowUp: '˄', ArrowDown: '˅' }[k]);
  });
  pad.addEventListener('pointercancel', () => { clearTimeout(longTimer); down = null; });
  addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter', 'Escape'].includes(e.key)) { e.preventDefault(); key(e.key); }
  });

  // The phone camera is the glasses camera.
  function jpeg(sx, sy, sw, sh, max) {
    const scale = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas'); c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    c.getContext('2d').drawImage($('cam'), sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  }
  let busy = false;
  async function photo() {
    const v = $('cam'); if (busy || !v.videoWidth) return; busy = true; $('busy').className = 'on';
    const t_capture = Date.now(); const vw = v.videoWidth; const vh = v.videoHeight; const side = Math.min(vw, vh) * 0.5;
    const imageBase64 = jpeg(0, 0, vw, vh, 1280);
    const focusBase64 = jpeg((vw - side) / 2, (vh - side) / 2, side, side, 512);
    try {
      const r = await fetch('/detect', { method: 'POST', headers: authHeaders({ 'content-type': 'application/json' }), body: JSON.stringify({ reqId: crypto.randomUUID ? crypto.randomUUID() : String(t_capture), imageBase64, focusBase64, lang: $('sLang').value, t_capture, preUploadMs: Date.now() - t_capture }) });
      if (r.status === 401) $('dot').className = 'bad';
    } catch { $('dot').className = 'bad'; }
    busy = false; $('busy').className = '';
  }
  $('shot').addEventListener('click', photo);

  // Bridge socket as the "phone": answers the Web App's Take photo with this camera.
  let ws = null;
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { ws.send(JSON.stringify({ type: 'hello', client: 'phone', ua: 'emulator', token })); $('dot').className = 'ok'; };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } if (m && m.type === 'capture') photo(); };
    ws.onclose = (e) => { $('dot').className = 'bad'; if (e.code !== 4401) setTimeout(connect, 1500); };
  }
  connect();

  // Chrome
  $('bSet').addEventListener('click', () => { $('sheet').classList.toggle('open'); $('bSet').classList.toggle('on'); });
  $('bClean').addEventListener('click', () => { document.body.classList.add('clean'); $('sheet').classList.remove('open'); $('bSet').classList.remove('on'); });
  // Leave clean view: three quick taps in the top right corner.
  let corner = []; addEventListener('pointerdown', (e) => {
    if (!document.body.classList.contains('clean') || e.clientX < innerWidth - 90 || e.clientY > 90) return;
    e.stopPropagation();
    const now = performance.now(); corner = corner.filter((t) => now - t < 800); corner.push(now);
    if (corner.length >= 3) { document.body.classList.remove('clean'); corner = []; }
  }, true);
  if (store.get('ghost', '0') === '1') { document.body.classList.add('ghost'); $('bGhost').classList.add('on'); }
  $('bGhost').addEventListener('click', () => { const on = document.body.classList.toggle('ghost'); $('bGhost').classList.toggle('on', on); store.set('ghost', on ? '1' : '0'); });
  $('bFull').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); });
  hud.addEventListener('load', fit);
})();
</script>
</body>
</html>
