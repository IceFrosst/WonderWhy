<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone stand-in</title>
<style>
:root{--bg:#111418;--panel:#1b2027;--line:#2c343f;--fg:#e8ecf1;--mut:#8b96a5;--acc:#4da3ff;--ok:#4cc38a;--bad:#ef5b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:12px;padding:12px;max-width:1300px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
h3{margin:8px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
video{width:100%;border-radius:6px;background:#000;max-height:260px;object-fit:cover}
button,select,input{font:inherit;color:var(--fg);background:#252c36;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button:disabled{cursor:not-allowed;opacity:.5}
.big{width:100%;padding:16px;font-size:18px;background:var(--acc);color:#04111f;font-weight:700;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:5px}.state-grid button{min-width:0;padding:5px 6px;overflow-wrap:anywhere}
input[type=text]{flex:1;min-width:120px}input[type=range]{flex:1;padding:0}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
#status{color:var(--mut);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:6px;background:#000}
</style></head><body><main>
<div>
<section><h2>Camera</h2>
<video id="v" autoplay playsinline muted></video>
<button class="big" id="cap" title="Capture a camera frame and send it for detection">Pinch / capture (Space)</button>
<div class="row"><label>Size <select id="size"><option value="360x640">LOW 360x640</option><option value="504x896" selected>MEDIUM 504x896</option><option value="720x1280">HIGH 720x1280</option></select></label><label>Language <select id="lang"><option value="en">en</option><option value="fi">fi</option><option value="sv">sv</option><option value="de">de</option><option value="es">es</option><option value="fr">fr</option></select></label><label><input type="checkbox" id="wait"> Wait for sketch</label></div>
<div class="row"><input type="text" id="q" placeholder="Optional question (stands in for speech)"></div>
<div class="row"><label>Simulated glasses&rarr;phone delay <b id="dl">0</b> ms</label><input type="range" id="delay" min="0" max="3000" step="50" value="0"></div>
<div id="status">Starting...</div></section>
<section><h2>Ask about what is on the glasses</h2><div class="row"><input type="text" id="askq" maxlength="300" placeholder="Ask a follow-up question"><button id="ask" title="Ask about the library object currently shown" disabled>Ask</button></div><div id="askhint">Waiting for the glasses state.</div></section>
<section><h2>Force object (skips model)</h2><div class="row" id="objs"></div></section>
<section><h2>States</h2>
<h3>Device</h3><div class="state-grid" id="dev"></div>
<h3>Lens</h3><div class="state-grid" id="nav"></div>
<h3>Demo</h3><div class="state-grid" id="demo"></div>
</section>
</div>
<div>
<section><h2>Latency <span id="prov" style="text-transform:none"></span></h2>
<div id="sum" style="margin-bottom:6px;font-size:12px"></div>
<table><thead><tr><th>req</th><th>object</th><th>cap&rarr;recv</th><th>detect</th><th>det&rarr;render</th><th>total</th></tr></thead><tbody id="rows"></tbody></table></section>
<section><h2>Glasses mirror</h2>
<div class="row"><input type="text" id="murl" value="/"><button id="mgo" title="Load the entered glasses preview URL">Load</button></div>
<iframe id="mirror" title="glasses preview"></iframe></section>
</div></main>
<script>
const $=id=>document.getElementById(id);
const pageUrl=new URL(location.href);const fragmentParams=new URLSearchParams(pageUrl.hash.slice(1));
const fragmentToken=fragmentParams.get('k');const queryToken=pageUrl.searchParams.get('k');const tokenFromUrl=fragmentToken!==null?fragmentToken:queryToken;
if(tokenFromUrl!==null){localStorage.setItem('lens.token',tokenFromUrl);fragmentParams.delete('k');pageUrl.searchParams.delete('k');pageUrl.hash=fragmentParams.toString()?`#${fragmentParams}`:'';history.replaceState(null,'',pageUrl.pathname+pageUrl.search+pageUrl.hash);}
const lensToken=localStorage.getItem('lens.token')||'';
const savedLang=localStorage.getItem('lens.lang');
if(['en','fi','sv','de','es','fr'].includes(savedLang))$('lang').value=savedLang;
$('lang').onchange=()=>localStorage.setItem('lens.lang',$('lang').value);
const authHeaders=h=>lensToken?{...h,'X-Lens-Token':lensToken}:h;
const wsUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws,locked=false,lastState=null,latestAskText='';const rows=[];
function setStatus(value,kind=''){$('status').textContent=String(value);$('status').className=kind;}
function updateAsk(){const id=lastState&&lastState.objectId;const unavailable=!id||id==='unknown'||id==='sketch';$('ask').disabled=unavailable;$('askhint').textContent=!id?'Waiting for the glasses state.':unavailable?'Follow-up questions need a library object.':'Ready to ask about '+id+'.';}
function showSketch(sketch){if(!sketch)return;const titles=(sketch.chapters||[]).map(c=>c.title).join(', ');$('status').textContent=sketch.label+(titles?' - '+titles:'');}
function connect(){ws=new WebSocket(wsUrl);
 ws.onopen=()=>ws.send(JSON.stringify({type:'hello',client:'phone',ua:navigator.userAgent,token:lensToken}));
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==='latency'){const r=rows.find(x=>x.reqId===m.reqId);if(r)Object.assign(r,m);else rows.push(m);render();refreshSummary();}
  if(m.type==='state'){lastState=m;updateAsk();if(!latestAskText)$('status').textContent='Glasses at '+m.objectId+' step '+m.step;}
  if(m.type==='sketch'&&m.sketch)showSketch(m.sketch);};
 ws.onclose=e=>{if(e.code===4401){locked=true;setStatus('Bridge locked: open this page with #k=<token>','bad');return;}if(!locked)setTimeout(connect,1000);};}
const send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));else $('status').textContent='WebSocket not connected';};
connect();
function mkBtns(el,list,fn){list.forEach(([label,val,title])=>{const b=document.createElement('button');b.textContent=label;b.title=title||'Send '+label;b.onclick=()=>fn(val);$(el).appendChild(b);});}
mkBtns('dev',[
 ['donned','donned','Show the display-ready state'],['doffed','doffed','Blank the display as if the glasses were removed'],
 ['battery_low','battery_low','Show the low-battery card'],['thermal_hot','thermal_hot','Show the high-temperature card'],
 ['offline','offline','Show the offline card'],['online','online','Show the reconnected card'],
 ['camera_denied','camera_denied','Show the camera-permission card'],['first_run','first_run','Show the first-run consent card'],
],s=>send({type:'device',state:s}));
mkBtns('nav',[
 ['left','left','Move to the previous lens'],['right','right','Move to the next lens'],
 ['up','up','Increase the current step control'],['down','down','Decrease the current step control'],
 ['next','next','Advance one explanation step'],['prev','prev','Return one explanation step'],
 ['deeper','deeper','Advance using the legacy deeper action'],['done','done','Finish the current explanation'],
],a=>send({type:'nav',action:a}));
mkBtns('nav',[
 ['clear','clear','Clear the glasses display'],
],()=>send({type:'clear'}));
mkBtns('nav',[
 ['error','error','Show a sample error card'],
],()=>send({type:'error',code:'test_error',message:'Test error from phone'}));
mkBtns('demo',[
 ['demo','demo','Start the hands-free demo'],
],a=>send({type:'nav',action:a}));
fetch('/objects').then(r=>r.json()).then(j=>mkBtns('objs',[...j.objects.map(o=>[o.id,o.id]),['unknown','unknown']],id=>capture(id)));
$('delay').oninput=()=>$('dl').textContent=$('delay').value;
let stream;
navigator.mediaDevices?.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}}}).then(s=>{stream=s;$('v').srcObject=s;setStatus('Camera ready');}).catch(e=>setStatus('Camera unavailable: '+e.message+'. Forced buttons still work.','bad'));
function grab(){const v=$('v');if(!v.videoWidth)return null;const [w,h]=$('size').value.split('x').map(Number);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 const s=Math.max(w/v.videoWidth,h/v.videoHeight),dw=v.videoWidth*s,dh=v.videoHeight*s;
 x.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh);return c.toDataURL('image/jpeg',0.7).split(',')[1];}
let busy=false;
async function capture(force){
 if(busy)return;busy=true;
 latestAskText='';
 const t_capture=Date.now();const reqId=crypto.randomUUID();
 const img=force?null:grab();
 if(!force&&!img){setStatus('No camera frame','bad');busy=false;return;}
 const d=Number($('delay').value);if(d)await new Promise(r=>setTimeout(r,d));
 $('status').textContent='Sending\u2026';
 try{const r=await fetch('/detect',{method:'POST',headers:authHeaders({'content-type':'application/json'}),body:JSON.stringify({reqId,imageBase64:img,question:$('q').value.trim()||undefined,forceObjectId:force||undefined,lang:$('lang').value,waitSketch:$('wait').checked,t_capture,preUploadMs:Date.now()-t_capture})});
  const j=await r.json();
  if(!r.ok){setStatus((j.error||r.status)+': '+(j.message||''),'bad');}
  else{setStatus(j.objectId+' ('+Math.round(j.confidence*100)+'%) via '+j.timings.model+(j.answer?' - '+j.answer:''),'ok');if(j.sketch)showSketch(j.sketch);
   $('prov').textContent='model: '+j.timings.model;
   rows.push({reqId,objectId:j.objectId,captureToReceivedMs:j.timings.preUploadMs,detectMs:j.timings.detectMs,detectedToRenderedMs:null,totalMs:null});render();}
 }catch(e){setStatus(e.message,'bad');}
 busy=false;}
$('cap').onclick=()=>capture();
$('ask').onclick=async()=>{
 const question=$('askq').value.trim();const id=lastState&&lastState.objectId;
 if(!question){setStatus('Enter a follow-up question','bad');return;}
 if(!id||id==='unknown'||id==='sketch'){updateAsk();return;}
 $('ask').disabled=true;$('status').textContent='Asking\u2026';
 try{const r=await fetch('/ask',{method:'POST',headers:authHeaders({'content-type':'application/json'}),body:JSON.stringify({reqId:crypto.randomUUID(),question,aboutObjectId:id,lang:$('lang').value})});
  const j=await r.json();
  if(!r.ok){latestAskText='';setStatus((j.error||r.status)+': '+(j.message||''),'bad');}
  else{const hint=j.lensHint?' - '+j.lensHint.id+' step '+j.lensHint.step:'';latestAskText=j.answer+hint;$('status').textContent=latestAskText;}
 }catch(e){latestAskText='';setStatus(e.message,'bad');}
 updateAsk();};
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();capture();}});
const f=v=>v==null?'\u2026':Math.round(v);
function render(){const body=$('rows');body.replaceChildren();rows.slice(-10).reverse().forEach(r=>{const tr=document.createElement('tr');[r.reqId.slice(0,6),r.objectId,f(r.captureToReceivedMs),f(r.detectMs),f(r.detectedToRenderedMs),f(r.totalMs)].forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.appendChild(td);});body.appendChild(tr);});}
async function refreshSummary(){try{const s=await (await fetch('/latency',{headers:authHeaders({})})).json();
 const p=k=>`${k.replace('Ms','')}: p50 ${f(s[k].p50)} / p90 ${f(s[k].p90)}`;
 $('sum').textContent=`n=${s.count} | `+['captureToReceivedMs','detectMs','detectedToRenderedMs','totalMs'].map(p).join(' | ');
 if(s.provider)$('prov').textContent='model: '+s.provider.model;}catch{}}
refreshSummary();
function mirrorUrl(){const u=new URL($('murl').value,location.href);u.searchParams.delete('k');if(lensToken){const hash=new URLSearchParams(u.hash.slice(1));hash.set('k',lensToken);u.hash=hash.toString();}return u.href;}
$('mgo').onclick=()=>$('mirror').src=mirrorUrl();
$('mirror').src=mirrorUrl();
</script></body></html>
